# Commerce -> Shipping.
#
# Buying a label spends money with a carrier, so it is bounded; voiding one
# reclaims it and is safe. Tires ship as freight often enough that the
# high-value band is real rather than theoretical.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "commerce:shipment"
  version: "default"
  importDerivedRoles:
    - common_erp_roles
  rules:
    - actions: ["view", "list", "track"]
      effect: EFFECT_ALLOW
      roles: ["support_agent", "warehouse_clerk", "sales_rep", "agent_operator", "admin"]
      condition:
        match:
          expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id

    - actions: ["buy_label"]
      effect: EFFECT_ALLOW
      roles: ["warehouse_clerk", "warehouse_manager", "agent_operator", "admin"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
              - expr: request.resource.attr.cost < 500

    # Freight and oversized shipments cost real money per mistake.
    - actions: ["buy_label"]
      effect: EFFECT_ALLOW
      roles: ["warehouse_manager", "admin"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
              - expr: request.resource.attr.cost >= 500
              - expr: request.resource.attr.approved_by_human == true

    # Voiding returns money; it needs no band.
    - actions: ["void_label"]
      effect: EFFECT_ALLOW
      roles: ["warehouse_clerk", "warehouse_manager", "admin"]
      condition:
        match:
          expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
