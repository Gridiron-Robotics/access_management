# Commerce -> Tax configuration and filing.
#
# Reading a tax rate is routine; changing nexus or a rate silently changes what
# every future order collects, and filing a return is a statement to a
# government. Those are separated deliberately.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "commerce:tax"
  version: "default"
  importDerivedRoles:
    - common_erp_roles
  rules:
    # Quoting tax on a cart is a read, and the agent needs it constantly.
    - actions: ["view", "quote"]
      effect: EFFECT_ALLOW
      roles: ["accountant", "finance_manager", "sales_rep", "agent_operator", "admin"]
      condition:
        match:
          expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id

    # Nexus and rate configuration changes what every future order collects.
    - actions: ["configure_nexus", "update_rate"]
      effect: EFFECT_ALLOW
      roles: ["finance_manager", "admin"]
      condition:
        match:
          expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id

    # Filing is a statement to a tax authority; it is never automated.
    - actions: ["file_return", "remit"]
      effect: EFFECT_ALLOW
      roles: ["finance_manager", "admin"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
              - expr: request.resource.attr.approved_by_human == true

    - actions: ["file_return", "remit", "configure_nexus", "update_rate"]
      effect: EFFECT_DENY
      roles: ["agent_operator", "agent_supervisor"]

    # Marking a customer exempt suppresses tax collection on every future order,
    # so it is finance's call, not support's.
    - actions: ["grant_exemption"]
      effect: EFFECT_ALLOW
      roles: ["finance_manager", "admin"]
      condition:
        match:
          expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
