# Inventory module -> Stock items.
# Clerks work items in their own warehouse location; managers move/delete anything.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "inventory:item"
  version: "default"
  importDerivedRoles:
    - common_erp_roles
  rules:
    # `warehouse` and `ops` are the ERP-gateway token roles (WAREHOUSE / OPS
    # scopes in the middleware). Ops reads stock for receiving and placement;
    # it does not move it here.
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["warehouse_clerk", "warehouse_manager", "warehouse", "ops"]

    # Clerks/managers can create or adjust stock only in their own location.
    - actions: ["create", "adjust"]
      effect: EFFECT_ALLOW
      roles: ["warehouse_clerk", "warehouse_manager"]
      condition:
        match:
          expr: request.resource.attr.location == request.principal.attr.location

    # The `warehouse` gateway role adjusts (decrements) stock, own location only.
    - actions: ["adjust"]
      effect: EFFECT_ALLOW
      roles: ["warehouse"]
      condition:
        match:
          expr: request.resource.attr.location == request.principal.attr.location

    - actions: ["transfer", "delete"]
      effect: EFFECT_ALLOW
      roles: ["warehouse_manager"]

    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
