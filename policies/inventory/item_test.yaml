# yaml-language-server: $schema=../../schema/jsonschema/cerbos/policy/v1/TestSuite.schema.json
---
name: Inventory item policy tests
principals:
  clerk_carl:
    id: carl
    roles: ["warehouse_clerk", "employee"]
    attr:
      location: NYC
  manager_mike:
    id: mike
    roles: ["warehouse_manager", "employee"]
    attr:
      location: NYC

  warehouse_wes:   # ERP-gateway WAREHOUSE role
    id: wes
    roles: ["warehouse", "employee"]
    attr:
      location: NYC
  ops_otto:        # ERP-gateway OPS role
    id: otto
    roles: ["ops", "employee"]
    attr:
      location: NYC
  hr_hal:          # ERP-gateway HR role
    id: hal
    roles: ["hr", "employee"]
    attr:
      location: NYC
  auditor_aud:     # external auditor — NOT staff
    id: aud
    roles: ["external_auditor"]
    attr:
      location: NYC
resources:
  item_nyc:
    id: itm-nyc
    kind: "inventory:item"
    attr:
      location: NYC
  item_la:
    id: itm-la
    kind: "inventory:item"
    attr:
      location: LA

tests:
  - name: Clerk can view and adjust items in their own location
    input:
      principals: [clerk_carl]
      resources: [item_nyc]
      actions: [view, create, adjust]
    expected:
      - principal: clerk_carl
        resource: item_nyc
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          adjust: EFFECT_ALLOW

  - name: Clerk can view but not adjust items in another location
    input:
      principals: [clerk_carl]
      resources: [item_la]
      actions: [view, adjust, transfer]
    expected:
      - principal: clerk_carl
        resource: item_la
        actions:
          view: EFFECT_ALLOW
          adjust: EFFECT_DENY
          transfer: EFFECT_DENY

  - name: Manager can transfer and delete items anywhere
    input:
      principals: [manager_mike]
      resources: [item_la]
      actions: [transfer, delete]
    expected:
      - principal: manager_mike
        resource: item_la
        actions:
          transfer: EFFECT_ALLOW
          delete: EFFECT_ALLOW

  - name: Warehouse role views and adjusts stock in its own location, nothing more
    input:
      principals: [warehouse_wes]
      resources: [item_nyc]
      actions: [view, create, adjust, transfer, delete]
    expected:
      - principal: warehouse_wes
        resource: item_nyc
        actions: { view: EFFECT_ALLOW, create: EFFECT_DENY, adjust: EFFECT_ALLOW, transfer: EFFECT_DENY, delete: EFFECT_DENY }

  - name: Warehouse role cannot adjust stock in another location
    input:
      principals: [warehouse_wes]
      resources: [item_la]
      actions: [view, create, adjust, transfer, delete]
    expected:
      - principal: warehouse_wes
        resource: item_la
        actions: { view: EFFECT_ALLOW, create: EFFECT_DENY, adjust: EFFECT_DENY, transfer: EFFECT_DENY, delete: EFFECT_DENY }

  - name: Ops role views stock but cannot change it
    input:
      principals: [ops_otto]
      resources: [item_nyc]
      actions: [view, create, adjust, transfer, delete]
    expected:
      - principal: ops_otto
        resource: item_nyc
        actions: { view: EFFECT_ALLOW, create: EFFECT_DENY, adjust: EFFECT_DENY, transfer: EFFECT_DENY, delete: EFFECT_DENY }

  - name: HR role is denied inventory, reads and writes
    input:
      principals: [hr_hal]
      resources: [item_nyc, item_la]
      actions: [view, create, adjust, transfer, delete]
    expected:
      - principal: hr_hal
        resource: item_nyc
        actions: { view: EFFECT_DENY, create: EFFECT_DENY, adjust: EFFECT_DENY, transfer: EFFECT_DENY, delete: EFFECT_DENY }
      - principal: hr_hal
        resource: item_la
        actions: { view: EFFECT_DENY, create: EFFECT_DENY, adjust: EFFECT_DENY, transfer: EFFECT_DENY, delete: EFFECT_DENY }

  - name: External auditor is denied every inventory action
    input:
      principals: [auditor_aud]
      resources: [item_nyc, item_la]
      actions: [view, create, adjust, transfer, delete]
    expected:
      - principal: auditor_aud
        resource: item_nyc
        actions: { view: EFFECT_DENY, create: EFFECT_DENY, adjust: EFFECT_DENY, transfer: EFFECT_DENY, delete: EFFECT_DENY }
      - principal: auditor_aud
        resource: item_la
        actions: { view: EFFECT_DENY, create: EFFECT_DENY, adjust: EFFECT_DENY, transfer: EFFECT_DENY, delete: EFFECT_DENY }
