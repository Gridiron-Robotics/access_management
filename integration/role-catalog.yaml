# Machine-readable role catalog for the HRMS "set access for this employee" page.
#
# The page renders ONE TOGGLE per role below, grouped by module. When an admin
# saves, store the selected role keys against the employee (see integration/README.md).
#
# Keep this in sync with policies/**: every role key here must exist in a policy,
# and every assignable role in a policy should appear here. (See ROLES.md.)
# integration/tests/test_role_catalog.py enforces the first half and that
# cerbos_access/catalog.py mirrors this file.
#
# `keycloak_realm_role: true` marks a role that must also reach the user's
# Keycloak token (realm `erp`) as a realm role of the same name. Assigning it
# on the access page is what grants it: the sync in cerbos_access/keycloak_sync.py
# adds/removes exactly these realm roles and never touches any other realm role
# a user holds. `external: true` marks a role for people outside the company.
version: 1

# Granted to all staff by default; enables ownership-based access (the `owner`
# derived role). The HRMS can auto-assign this to every active employee.
baseline_roles:
  - key: employee
    label: Employee (baseline)
    description: Default for all staff; enables "can act on my own records".

# Full access to everything. Show this clearly separated and grant sparingly.
global_roles:
  - key: admin
    label: Administrator
    description: Full access to every module. Grant to very few people.

modules:
  - key: finance
    label: Finance / Accounting
    roles:
      - key: accountant
        label: Accountant
        description: View and create invoices.
      - key: finance_manager
        label: Finance Manager
        description: Approve invoices under $10,000.

  - key: inventory
    label: Inventory / Warehouse
    roles:
      - key: warehouse_clerk
        label: Warehouse Clerk
        description: View items; create/adjust stock in their own location.
      - key: warehouse_manager
        label: Warehouse Manager
        description: Also transfer and delete items anywhere.
      - key: warehouse
        label: Warehouse (ERP gateway)
        keycloak_realm_role: true
        description: >-
          Stock reads and adjustments in their own location; view tenant orders
          and shipments; ERP gateway tools scoped to WAREHOUSE (destructive ones
          only with a recorded human approval). No finance access.

  - key: hr
    label: HR / People
    roles:
      - key: hr_specialist
        label: HR Specialist
        description: View and edit employee records.
      - key: hr_manager
        label: HR Manager
        description: Also terminate employee records.
      - key: hr
        label: HR (ERP gateway)
        keycloak_realm_role: true
        description: >-
          View and edit employee records (not terminate); ERP gateway tools
          scoped to HR (destructive ones only with a recorded human approval).
          No inventory or finance access.

  - key: sales
    label: Sales / CRM
    roles:
      - key: sales_rep
        label: Sales Rep
        description: View/create leads; update their own leads.
      - key: sales_manager
        label: Sales Manager
        description: Also reassign and update any lead.

  - key: purchasing
    label: Purchasing / Procurement
    roles:
      - key: buyer
        label: Buyer
        description: View/create POs; submit their own for approval.
      - key: purchasing_manager
        label: Purchasing Manager
        description: Approve purchase orders up to $25,000.

  - key: manufacturing
    label: Manufacturing / Production
    roles:
      - key: operator
        label: Operator
        description: View work orders; start/complete on their own line.
      - key: supervisor
        label: Supervisor
        description: Also start/complete on any line and cancel.

  - key: commerce
    label: Commerce / Selling
    roles:
      - key: sales_rep
        label: Sales Rep
        description: View and create orders; view listings.
      - key: support_agent
        label: Support Agent
        description: Create RMAs, cancel unfulfilled orders, issue refunds under $250.
      - key: support_manager
        label: Support Manager
        description: Also authorize out-of-window returns and refunds under $2,500.

  - key: channels
    label: Sales Channels
    description: >-
      Grant a channel role together with the `channels` attribute below. A
      channel manager may only publish and edit listings on the channels they
      are actually assigned.
    roles:
      - key: channel_manager
        label: Channel Manager
        description: Publish/edit marketplace listings on their assigned channels.

  - key: pricing
    label: Pricing
    roles:
      - key: pricing_analyst
        label: Pricing Analyst
        description: Reprice within guardrails (at or above floor, moves of 15% or less).
      - key: pricing_manager
        label: Pricing Manager
        description: Approve repricing that breaks the guardrails, including below-floor.

  - key: distribution
    label: Distributors / Drop-ship
    description: >-
      Grant together with the `distributors` attribute below. A distributor
      manager may only dispatch drop-ship orders and bulk-import feeds for the
      distributors they are assigned.
    roles:
      - key: distributor_manager
        label: Distributor Manager
        description: Dispatch drop-ship orders under $5,000; bulk-import that distributor's feed.

  - key: catalog
    label: Catalog / Fitment
    roles:
      - key: catalog_manager
        label: Catalog Manager
        description: Edit catalog records; publish fitment once it has been validated.

  - key: agent
    label: AI Agent Operation
    description: >-
      These govern what the autonomous agent may do on its own authority. Note
      that NO agent role can issue a refund, disburse funds, file a tax return
      or commit a drop-ship dispatch — those require a human every time.
    roles:
      - key: agent_operator
        label: Agent Operator (service account)
        description: Dispatch non-destructive MCP tools within its tool scopes.
      - key: agent_supervisor
        label: Agent Supervisor
        description: Dispatch destructive MCP tools, but only with a recorded human approval.

  - key: operations
    label: Operations
    roles:
      - key: ops
        label: Operations (ERP gateway)
        keycloak_realm_role: true
        description: >-
          View/create purchase orders (not approve) and view stock; ERP gateway
          tools scoped to OPS — purchasing, receiving, placement release,
          deduction holds, model governance (destructive ones only with a
          recorded human approval). Cannot administer the gateway.

  - key: external
    label: External parties — NOT staff
    description: >-
      For people OUTSIDE the company (e.g. the audit firm). These roles grant
      no staff access at all: do not combine them with staff roles, and do not
      assign them to employees. An employee assigned only an external role is
      not given the `employee` baseline either.
    roles:
      - key: external_auditor
        label: External Auditor (read-only, NOT staff)
        keycloak_realm_role: true
        external: true
        description: >-
          Read-only audit evidence through the ERP gateway — the five audit_prep
          read tools (entity change history, audit-chain check, PBC request
          list, tie-out run, audit package) in their own tenant. Cannot change
          anything anywhere.


# Attributes the HRMS/ERP must supply per user (NOT toggled on the page; read at
# request time). These drive the conditional rules (e.g. same-location adjust).
attributes:
  - key: department
    label: Department
    source: HRMS
  - key: location
    label: Warehouse location
    source: ERP/Ops
  - key: line
    label: Production line
    source: ERP/Ops
  - key: tenant_id
    label: Tenant
    source: ERP
    description: >-
      REQUIRED on every principal. Every commerce and agent policy is scoped by
      it, including for administrators — an admin is an admin OF A TENANT, not
      of the estate. A principal with no tenant_id is denied, not defaulted.
  - key: channels
    label: Assigned sales channels
    source: ERP/Ops
    description: List, e.g. ["amazon", "ebay"]. Read by the channel_manager role.
  - key: distributors
    label: Assigned distributors
    source: ERP/Ops
    description: List, e.g. ["ATD", "NTW"]. Read by the distributor_manager role.
  - key: tool_scopes
    label: MCP servers this principal may reach
    source: ERP/Ops
    description: >-
      List of MCP server names. This is what stops an agent with a legitimate
      reason to read inventory from also reaching the payments server.
