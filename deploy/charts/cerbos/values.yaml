# Default values for cerbos.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# @schema
# type: [string,null]
# @schema
nameOverride: ""

# @schema
# type: [string,null]
# @schema
fullnameOverride: ""

# @schema
# type: [integer]
# default: 1
# @schema
# Number of Cerbos pods to run
replicaCount: 1

# @schema
# required: false
# @schema
# Container image details. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#image.
image:
  # @schema
  # default: "ghcr.io.cerbos/cerbos"
  # @schema
  # Container image name without the tag.
  repository: ghcr.io/cerbos/cerbos
  # @schema
  # enum: [IfNotPresent, Always]
  # default: ["IfNotPresent"]
  # @schema
  # Image pull policy.
  pullPolicy: IfNotPresent
  # @schema
  # type: [string,null]
  # @schema
  # Image digest to use. Takes precedence over tag if specified.
  digest: ""
  # @schema
  # type: [string,null]
  # @schema
  # Image tag to use. Defaults to the chart appVersion.
  tag: ""

# @schema
# type: [array,null]
# items:
#   type: object
#   properties:
#     name:
#       type: string
# @schema
# Image pull secrets to use if pulling the image from a private container registry. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers.
imagePullSecrets: []

# @schema
# type: [array, null]
# items:
#   type: object
#   additionalProperties: true
# @schema
# Init containers to inject into the deployment. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#containers.
initContainers: []

# @schema
# required: false
# @schema
# Service account settings
serviceAccount:
  # @schema
  # default: true
  # @schema
  # Specifies whether a service account should be created.
  create: true
  # @schema
  # type: [object, null]
  # additionalProperties: true
  # @schema
  # Annotations to add to the service account. See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/object-meta/#ObjectMeta.
  annotations: {}
  # @schema
  # type: [string,null]
  # @schema
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# @schema
# type: [object, null]
# additionalProperties: true
# @schema
# Annotations to add to the pod. See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/object-meta/#ObjectMeta.
podAnnotations: {}

# @schema
# type: [object, null]
# additionalProperties: true
# @schema
# Labels to add to the pod. See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/object-meta/#ObjectMeta.
podLabels: {}

# @schema
# type: [object, null]
# additionalProperties: true
# @schema
# Common labels to add to the resources. See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/object-meta/#ObjectMeta.
commonLabels: {}

# @schema
# required: false
# @schema
# Annotations to add to the deployment. See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/object-meta/#ObjectMeta.
deployment:
  # @schema
  # type: [object, null]
  # additionalProperties: true
  # @schema
  annotations: {}

# @schema
# type: [object, null]
# additionalProperties: true
# @schema
# Security context for the whole pod. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1.
podSecurityContext: {}

# @schema
# type: [object, null]
# additionalProperties: true
# @schema
# Security context for the Cerbos container. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#security-context-1.
securityContext: {}

# @schema
# type: [object, null]
# properties:
#   limits:
#     type: object
#   requests:
#     type: object
# additionalProperties: true
# @schema
# Resource limits for the pod. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#resources.
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# @schema
# type: object
# properties:
#   enabled:
#     type: boolean
#     default: false
#   minReplicas:
#     type: integer
#     default: 1
#   maxReplicas:
#     type: integer
#     default: 100
#   targetCPUUtilizationPercentage:
#     type: [integer, null]
#     default: 80
#   targetMemoryUtilizationPercentage:
#     type: [integer, null]
# additionalProperties: true
# @schema
# Autoscaling configuration.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# @schema
# type: [object, null]
# additionalProperties: true
# @schema
# Node selector for the pod. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling.
nodeSelector: {}

# @schema
# type: [array, null]
# items:
#   type: object
#   additionalProperties: true
# @schema
# Pod tolerations.  See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling.
tolerations: []

# @schema
# type: [object, null]
# additionalProperties: true
# @schema
# Pod affinity rules. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling.
affinity: {}

# @schema
# type: [array, null]
# items:
#   type: object
#   additionalProperties: true
# @schema
# Topology Spread Constraints rules. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling.
topologySpreadConstraints: []
  # @schema type:[array,null]
  # - topologyKey: topology.kubernetes.io/zone
  #   maxSkew: 1
  #   whenUnsatisfiable: ScheduleAnyway

# @schema
# type: [array, null]
# items:
#   type: object
#   additionalProperties: true
# @schema
# Volumes to add to the pod. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#volumes.
volumes: []

# @schema
# type: [array, null]
# items:
#   type: object
#   additionalProperties: true
# @schema
# Volume mounts to add to the Cerbos container. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#volumes-1.
volumeMounts: []

# @schema
# type: [array, null]
# items:
#   type: object
#   properties:
#     name:
#       type: string
#     value:
#       type: string
#   additionalProperties: true
# @schema
# Environment variables to add to the pod. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#environment-variables.
env: [] # @schema type[array,null]

# @schema
# type: [array, null]
# items:
#   type: object
#   additionalProperties: true
# @schema
# Source environment variables from config maps or secrets. See https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#environment-variables.
envFrom: []

# @schema
# type: object
# properties:
#   certSpec:
#     type: [object, null]
# @schema
# Spec of the cert-manager certificate to create for the Cerbos deployment.
# If certSpec is not empty, a cert-manager.io/v1/Certificate resource will be created with its spec populated with values from certSpec.
# The certSpec value must be a valid Certificate spec. This Helm chart does not provide any defaults or inject any values into it.
# If cerbos.tlsSecretName is defined, it takes precedence over the generated certificate.
certManager:
  certSpec: {}

# @schema
# enum: [deployment,daemonset]
# default: deployment
# @schema
# Kubernetes workload type to use. Valid values are `deployment` or `daemonset`.
type: deployment

# @schema
# type: [string,null]
# @schema
# PriorityClassName to set on deployed pods
priorityClassName: ""

# @schema
# required: false
# @schema
# Cerbos service settings.
service:
  # @schema
  # enum: [ClusterIP, NodePort, LoadBalancer]
  # default: ClusterIP
  # @schema
  # Service type
  type: ClusterIP
  # @schema
  # default: 3592
  # @schema
  # Service HTTP port
  httpPort: 3592
  # @schema
  # default: 3593
  # @schema
  # Service gRPC port
  grpcPort: 3593
  # @schema
  # default: 13592
  # @schema
  # HTTP node port (if service type is NodePort)
  httpNodePort: 13592
  # @schema
  # default: 13593
  # @schema
  # gRPC node port (if service type is NodePort)
  grpcNodePort: 13593
  # @schema
  # type: [object, null]
  # additionalProperties: true
  # @schema
  # Service annotations
  annotations: {}
  # @schema
  # type: [string, null]
  # @schema
  # Service Cluster IP
  clusterIP: null
  # @schema
  # type: [string, null]
  # @schema
  # LoadBalancer static IP
  loadBalancerIP: null
  # @schema
  # type: [string, null]
  # @schema
  # Set the internalTrafficPolicy. If this is unset and .Values.type is set to daemonset, this will default to "Local"
  internalTrafficPolicy: ""
  # @schema
  # enum: ["", PreferClose, PreferSameZone, PreferSameNode]
  # @schema
  # Set the trafficDistribution.
  trafficDistribution: ""

# @schema
# required: false
# @schema
# Cerbos deployment settings.
cerbos:
  # Port to expose the http service on.
  httpPort: 3592
  # Port to expose the gRPC service on.
  grpcPort: 3593
  # @schema
  # type: [string, null]
  # @schema
  # Secret containing the TLS certificate.
  # Leave empty to disable TLS.
  # The secret must contain the following keys:
  #  - tls.crt: Required. Certificate file contents.
  #  - tls.key: Required. Private key for the certificate.
  #  - ca.crt: Optional. CA certificate to add to the trust pool.
  tlsSecretName: ""
  # Cerbos log level. Valid values are DEBUG, INFO, WARN and ERROR
  logLevel: INFO
  # Add Prometheus service discovery annotations to the pod.
  prometheusPodAnnotationsEnabled: true
  # @schema
  # type: [object, null]
  # additionalProperties: true
  # @schema
  # Cerbos config file contents.
  # Some server settings like server.httpListenAddr, server.grpcListenAddr, server.tls will be overwritten by the chart based on values provided above.
  config: {}

# @schema
# required: false
# @schema
# Contract-A MCP sidecar (integration/mcp/server.py) — the agent-plane surface
# that answers "may this principal do that?" before an action is planned. A
# SEPARATE Deployment + Service from the Cerbos PDP on purpose: the PDP is
# upstream Cerbos (Go) and is not ours to modify, so the sidecar can be
# restarted or removed without touching the engine every enforcing service
# depends on. Disabled by default so a default render is byte-identical to
# upstream. See deploy/charts/cerbos/values-mcp.yaml for an enabled example.
mcp:
  # @schema
  # default: false
  # @schema
  # Render the MCP sidecar Deployment + Service. Off by default.
  enabled: false
  # @schema
  # required: false
  # @schema
  # Sidecar image, built from deploy/mcp/Dockerfile. Pin an exact tag; a
  # floating one makes the deploy unreproducible.
  image:
    # @schema
    # type: [string,null]
    # @schema
    # Container image name without the tag.
    repository: ""
    # @schema
    # enum: [IfNotPresent, Always]
    # default: IfNotPresent
    # @schema
    # Image pull policy.
    pullPolicy: IfNotPresent
    # @schema
    # type: [string,null]
    # @schema
    # Image digest to use. Takes precedence over tag if specified.
    digest: ""
    # @schema
    # type: [string,null]
    # @schema
    # Image tag to use.
    tag: ""
  # @schema
  # type: [integer]
  # default: 1
  # @schema
  # Number of sidecar pods to run.
  replicaCount: 1
  # @schema
  # type: [integer]
  # default: 8085
  # @schema
  # Port the MCP surface listens on. Contract-A fixes this at 8085.
  port: 8085
  # @schema
  # required: false
  # @schema
  # Service settings for the sidecar.
  service:
    # @schema
    # default: access-management-mcp
    # @schema
    # Service name. The agent platform binds this exact DNS name
    # (langgraph-agents/specialists/registry.py), so keep the default unless the
    # consumer is updated in lockstep.
    name: access-management-mcp
    # @schema
    # enum: [ClusterIP, NodePort, LoadBalancer]
    # default: ClusterIP
    # @schema
    # Service type.
    type: ClusterIP
  # @schema
  # type: [string,null]
  # @schema
  # Name of a PRE-CREATED Secret holding ACCESS_MCP_TOKEN. REQUIRED when
  # mcp.enabled — the chart fails to render without it. No token value ever
  # lives in these values.
  #   kubectl create secret generic access-mcp --from-literal=ACCESS_MCP_TOKEN=...
  existingSecret: ""
  # @schema
  # type: [string,null]
  # default: ACCESS_MCP_TOKEN
  # @schema
  # Key within existingSecret that holds the bearer token.
  tokenSecretKey: ACCESS_MCP_TOKEN
  # @schema
  # type: [object, null]
  # additionalProperties: true
  # @schema
  # Resource limits for the sidecar container.
  resources: {}
  # @schema
  # type: [object, null]
  # additionalProperties: true
  # @schema
  # Security context for the sidecar pod.
  podSecurityContext: {}
  # @schema
  # type: [object, null]
  # additionalProperties: true
  # @schema
  # Security context for the sidecar container.
  securityContext: {}
  # @schema
  # type: [array, null]
  # items:
  #   type: object
  #   additionalProperties: true
  # @schema
  # Extra environment variables for the sidecar (e.g. OTEL_* exporter settings).
  env: []
