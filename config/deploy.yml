# Kamal 2.11.0 deployment for the access-management PDP (Cerbos + ERP policies).
# Docs: https://kamal-deploy.org
#
# Replace every value marked with  <-- CHANGE  before your first deploy.
# Run `bundle exec kamal config` to validate this file.
---
service: access-management

# Image name in your container registry (namespace/name, no tag — Kamal adds it).
image: your-org/access-management            # <-- CHANGE

servers:
  web:
    hosts:
      - 203.0.113.10                          # <-- CHANGE to your Docker host(s)
    # To also expose the gRPC API (port 3593) directly (kamal-proxy fronts HTTP
    # only), uncomment:
    # options:
    #   publish:
    #     - "3593:3593"

# kamal-proxy terminates TLS and forwards to Cerbos's HTTP port.
proxy:
  ssl: true
  host: access.example.com                    # <-- CHANGE to your domain
  app_port: 3592
  healthcheck:
    path: /_cerbos/health
    interval: 3
    timeout: 5

registry:
  server: ghcr.io                             # <-- CHANGE if not using GitHub CR
  username: your-org                          # <-- CHANGE (GitHub user/org for ghcr.io)
  password:
    - KAMAL_REGISTRY_PASSWORD                 # resolved from .kamal/secrets

builder:
  arch: amd64
  dockerfile: deploy/kamal/Dockerfile
  context: .

env:
  clear:
    CERBOS_NO_TELEMETRY: "1"
    CERBOS_CONFIG: /conf.yaml
  # For Cerbos Hub mode, deploy with:  bundle exec kamal deploy -d hub
  # (uses config/deploy.hub.yml -> CERBOS_CONFIG=/conf.hub.yaml + CERBOS_HUB_*
  #  secrets). Plain `kamal deploy` stays on disk mode. See integration/CERBOS_HUB.md.

# Give the PDP time to boot and pass its healthcheck before Kamal rolls back.
deploy_timeout: 30
drain_timeout: 30

# The Contract-A MCP surface (integration/mcp/server.py) — how the agent brain
# ASKS this PDP "may this principal do that?" before acting. A separate image
# from the PDP on purpose: the PDP is upstream Cerbos (Go) and is not ours to
# modify, so the sidecar can be restarted or removed without touching the engine
# every enforcing service depends on.
#
# Build it separately (Kamal accessories take a prebuilt image):
#   docker build -f deploy/mcp/Dockerfile -t your-org/access-management-mcp:<sha> .
#   docker push  your-org/access-management-mcp:<sha>
#
# ACCESS_MCP_TOKEN has no default anywhere — the service refuses to start
# without it, so an unconfigured deploy fails loudly instead of serving the
# estate's authorization model unauthenticated.
accessories:
  mcp:
    image: your-org/access-management-mcp:0.1.0   # <-- CHANGE (exact tag, never :latest)
    host: 203.0.113.10                            # <-- CHANGE (same host as the PDP)
    port: "8085:8085"
    env:
      clear:
        CERBOS_PDP_URL: http://access-management:3592
        OTEL_SERVICE_NAME: access_management
        # OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      secret:
        - ACCESS_MCP_TOKEN
        - OTEL_EXPORTER_OTLP_HEADERS
